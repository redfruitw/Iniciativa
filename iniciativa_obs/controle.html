<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Controle de Iniciativa</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="controle-ui lista">

<h1>Iniciativa</h1>

<div class="lista-cards">

  <div class="card-horizontal">
    <img src="portraits/p1.png">
    <div class="campos">
      <input id="n0" value="Jogador 1" placeholder="Nome">
      <input id="r0" type="number" value="15" placeholder="Rolagem">
      <input id="i0" value="portraits/p1.png">
    </div>
  </div>

  <div class="card-horizontal">
    <img src="portraits/p2.png">
    <div class="campos">
      <input id="n1" value="Jogador 2" placeholder="Nome">
      <input id="r1" type="number" value="12" placeholder="Rolagem">
      <input id="i1" value="portraits/p2.png">
    </div>
  </div>

  <div class="card-horizontal">
    <img src="portraits/p3.png">
    <div class="campos">
      <input id="n2" value="Jogador 3" placeholder="Nome">
      <input id="r2" type="number" value="18" placeholder="Rolagem">
      <input id="i2" value="portraits/p3.png">
    </div>
  </div>

  <div class="card-horizontal">
    <img src="portraits/p4.png">
    <div class="campos">
      <input id="n3" value="Jogador 4" placeholder="Nome">
      <input id="r3" type="number" value="10" placeholder="Rolagem">
      <input id="i3" value="portraits/p4.png">
    </div>
  </div>

</div>

<div class="botoes fixo">
  <button onclick="salvar()">Salvar Ordem</button>
  <button onclick="proximo()">Próximo Turno</button>
</div>

<script src="script.js"></script>
</body>
</html>
