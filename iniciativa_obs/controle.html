<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Controle de Iniciativa</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="controle-ui">

<h1>Iniciativa</h1>

<div class="controle-cards">

  <div class="card">
    <img src="portraits/p1.png">
    <input id="n0" placeholder="Nome" value="Jogador 1">
    <input id="r0" type="number" placeholder="Rolagem" value="15">
    <input id="i0" value="portraits/p1.png">
  </div>

  <div class="card">
    <img src="portraits/p2.png">
    <input id="n1" placeholder="Nome" value="Jogador 2">
    <input id="r1" type="number" placeholder="Rolagem" value="12">
    <input id="i1" value="portraits/p2.png">
  </div>

  <div class="card">
    <img src="portraits/p3.png">
    <input id="n2" placeholder="Nome" value="Jogador 3">
    <input id="r2" type="number" placeholder="Rolagem" value="18">
    <input id="i2" value="portraits/p3.png">
  </div>

  <div class="card">
    <img src="portraits/p4.png">
    <input id="n3" placeholder="Nome" value="Jogador 4">
    <input id="r3" type="number" placeholder="Rolagem" value="10">
    <input id="i3" value="portraits/p4.png">
  </div>

</div>

<div class="botoes">
  <button onclick="salvar()">Salvar Ordem</button>
  <button onclick="proximo()">Próximo Turno</button>
</div>

<script src="script.js"></script>
</body>
</html>
